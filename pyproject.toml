[project]
name = "mcd-postmortem"
version = "0.1.0"
description = "麦门彻查 · 把你的麦当劳历史订单审计成一份正经的 SRE 事故复盘报告"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mcd-postmortem contributors" }]
keywords = ["mcp", "mcdonald", "postmortem", "sre", "cli"]
dependencies = []

[project.scripts]
mcd-postmortem = "mcd_postmortem.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcd_postmortem*"]
